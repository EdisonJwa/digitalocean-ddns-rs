[package]
name = "digitalocean-ddns-rs"
version = "0.4.0"
edition = "2021"
authors = ["Edison Jwa<me@edison.network>"]
description = "A simple DDNS client for dgon"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
hickory-resolver = "0.26"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
toml = "1.0"
